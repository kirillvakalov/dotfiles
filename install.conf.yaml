- defaults:
    link:
      create: true
      relink: true

- clean:
    ~/:
    ~/.config:
      recursive: true
    ~/.agents/skills:
      recursive: true
    ~/.codex/skills:
      recursive: true

- link:
    ~/.gitconfig:
    ~/.hushlogin:
    ~/.zprofile:
      force: true
    ~/.zshenv:
    ~/.zshrc:
    ~/.zimrc:
    ~/.codex/:
      glob: true
      force: true
      path: codex/**
    ~/.docker/config.json:
      force: true
      path: docker/config.json
    ~/.config/:
      glob: true
      force: true
      path: config/**
    ~/.agents/skills/:
      glob: true
      force: true
      path: skills/*

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [paneru install, Installing Paneru WM service]
