git:
  overrideGpg: true
  diffRenderers:
    - command: diff-so-fancy
    - command: difft --color=always --syntax-highlight=off
      type: extDiff
gui:
  sidePanelWidth: 0.25
  authorColors:
    "*": "blue"
  theme:
    # Config below is generated by scripts/theme.sh.
    # 💡 Please run this script again after you change ghostty theme to update
    # colors to new values
    selectedLineBgColor:
      - '#49473e'
