#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Kirill Vakalov"
email = "102545999+kirillvakalov@users.noreply.github.com"

[ui]
default-command = "log"
diff-formatter = "difft"
diff-instructions = false
diff-editor = ["nvim", "--cmd", "let g:auto_session_enabled = v:false", "-c", "DiffEditor $left $right $output"]

# jj passes diff as two directories, diff-so-fancy expects a unified diff on stdin
[merge-tools.diff-so-fancy]
program = "sh"
diff-args = ["-c", 'diff -r -u -N -- "$left" "$right" | diff-so-fancy']

[[--scope]]
--when.environments = ["JJ_FANCY=1"]
ui.diff-formatter = "diff-so-fancy"
